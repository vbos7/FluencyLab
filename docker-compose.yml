services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fluencylab-backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 8889
      DB_NAME: db_fluencylab
      DB_USER: root
      DB_PASS: root
    ports:
      - "8000:80"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    container_name: fluencylab-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
