services:
  mysql:
    image: mysql:8.4
    container_name: fluencylab-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root}
      MYSQL_DATABASE: ${DB_NAME:-fluency_lab}
    ports:
      # 3307 no host para não colidir com um MySQL já instalado na máquina
      # (MAMP usa 8889, Homebrew usa 3306). Dentro da rede do compose é 3306.
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Tudo que estiver em docker-entrypoint-initdb.d roda automaticamente
      # na PRIMEIRA vez que o volume é criado. É isso que faz o banco já subir
      # pronto no `docker compose up` inicial, sem passo manual.
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      # O backend não pode subir antes do MySQL aceitar conexões, senão o PDO
      # falha no primeiro request. Este teste é o que o depends_on abaixo espera.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASS:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fluencylab-backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    environment:
      # DB_HOST é o NOME DO SERVIÇO: o compose cria um DNS interno, então
      # "mysql" resolve para o IP do container do banco. E a porta aqui é a
      # interna (3306), não a publicada no host.
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-fluency_lab}
      DB_USER: root
      DB_PASS: ${DB_PASS:-root}
      # Origem autorizada no CORS. Só precisa mudar se você trocar FRONTEND_PORT.
      APP_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:80"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Atenção: isto é lido em BUILD time (o Next inlina NEXT_PUBLIC_* no
        # bundle). Se mudar BACKEND_PORT, precisa rebuildar: docker compose up -d --build
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}/api
    container_name: fluencylab-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  # Volume nomeado: os dados do MySQL sobrevivem a `docker compose down`.
  # Para apagar de vez (e forçar o schema a rodar do zero): docker compose down -v
  db_data:
